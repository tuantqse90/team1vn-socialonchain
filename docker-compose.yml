services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: soc
      POSTGRES_PASSWORD: soc
      POSTGRES_DB: socialonchain
    ports:
      - "5440:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soc -d socialonchain"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
