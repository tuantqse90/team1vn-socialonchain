name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: foundry-rs/foundry-toolchain@v1
      - name: forge test
        working-directory: contracts
        run: forge test --gas-report

  ts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: soc
          POSTGRES_PASSWORD: soc
          POSTGRES_DB: socialonchain_test
        ports: ["5440:5432"]
        options: >-
          --health-cmd "pg_isready -U soc" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://soc:soc@localhost:5440/socialonchain_test
      DATABASE_URL: postgres://soc:soc@localhost:5440/socialonchain_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # anvil + forge cho integration test của indexer
      - uses: foundry-rs/foundry-toolchain@v1
      - run: pnpm lint
      - run: pnpm typecheck
      # forge test đã chạy ở job `contracts`.
      - run: pnpm turbo run test --filter='!@socialonchain/contracts'
      # Heuristic labeler (không cần key): fail nếu macro F1 tụt dưới ngưỡng.
      - run: pnpm eval:labeler
