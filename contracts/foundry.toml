[profile.default]
src = "src"
out = "out"
libs = ["lib", "node_modules"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10000
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
]
fs_permissions = [{ access = "read-write", path = "../packages/protocol/deployments" }]

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 64

[rpc_endpoints]
anvil = "${ANVIL_RPC_URL}"
fuji = "${FUJI_RPC_URL}"
